services:
  - type: web
    name: ekocrop-jira-release-map
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.19.5
      - key: RELEASES
        value: 10.0,10.1
      - key: JIRA_BASE_URL
        value: https://dev.ekoniva-apk.com
      - key: JIRA_PROJECT_KEYS
        value: DEVELOP,PROJECTS
      - key: JIRA_AUTOMATION_WEBHOOK_URL
        sync: false
      - key: JIRA_AUTOMATION_WEBHOOK_TOKEN
        sync: false
      - key: JIRA_AUTH_HEADER
        sync: false
